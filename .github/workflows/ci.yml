name: CNPM-Full CI Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master, dev ]

jobs:
  backend-tests:
    name: Run Django Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r calendar-backend/requirements.txt

      - name: Run Backend Unit Tests
        run: |
          cd calendar-backend
          python manage.py test --settings=core.test_settings

  frontend-build:
    name: Validate Next.js Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: calendar-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd calendar-frontend
          npm ci || npm install

      - name: Check Next.js Build
        run: |
          cd calendar-frontend
          npm run build
