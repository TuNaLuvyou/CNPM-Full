version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: cnpm_mysql
    restart: always
    environment:
      MYSQL_DATABASE: cnpm_db
      MYSQL_USER: calendar
      MYSQL_PASSWORD: 123
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
