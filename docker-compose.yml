version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: cnpm_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-cnpm_db}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

